[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deltaparse"
version = "0.1.0"
description = "Turn PDFs and scans into markdown with layout boxes, using the best open document model (NVIDIA Nemotron 3.5 Parse)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["modal>=1.0", "fastapi>=0.110"]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
deltaparse = "deltaparse.cli:main"

[project.urls]
Homepage = "https://github.com/DeltaXY-AI/parse"
Issues = "https://github.com/DeltaXY-AI/parse/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
